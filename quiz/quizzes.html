<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenshinQuiz - Create</title>

<link rel="stylesheet" href="C:\Users\Acer\Documents\GitHub\GenshinQuiz\create\create.css">
<link rel="stylesheet" href="C:\Users\Acer\Documents\GitHub\GenshinQuiz\cursor\cursor.css">
<style>

html, body, *, *::before, *::after {
    cursor: url("../cursor/gencur.png"), auto !important;
}
*:hover,
*:active {
    cursor: url("../cursor/gencur.png"), auto !important;
}

.quiz-title {
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #ffc7f9;
    text-align: center;
    text-shadow: 0 0 10px rgba(240,0,220,0.55), 0 2px 10px rgba(0,0,0,0.6), 0 0 15px rgba(90,130,255,0.6);
    font-weight: 600;
    font-size: clamp(1.6rem, 2.8vw, 2.4rem);
    margin: 10px 0 10px 0;
}

.quiz-description {
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #dba0ff;
    font-size: clamp(1rem, 1.8vw, 1.3rem);
    text-align: center;
    text-shadow: 0 0 6px rgba(220,180,255,0.4);
    margin-bottom: 20px;
}

.question h4 {
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #ffc7f9;
    text-align: center;
    text-shadow: 0 0 10px rgba(240,0,220,0.55), 0 2px 10px rgba(0,0,0,0.6);
    font-weight: 600;
    font-size: clamp(1.3rem, 2.2vw, 1.8rem);
    margin-bottom: 20px;
    line-height: 1.4;
}

.option {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 12px 0;
    padding: 18px 24px;
    border-radius: 14px;
    background: rgba(20, 15, 40, 0.55);
    border: 2px solid rgba(200, 120, 255, 0.7);
    cursor: pointer;
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 1.2rem;
    color: #dba0ff;
    text-align: center;
    transition: all 0.25s ease;
    min-height: 60px;
}

.option:hover {
    transform: scale(1.05);
    border-color: #ffbaff;
    box-shadow: 0 0 15px rgba(220, 120, 255, 0.6);
    background: rgba(35, 20, 60, 0.75);
}

.option.selected {
    background: linear-gradient(135deg, #b180ff, #d993ff, #ffa0f0);
    color: #fff;
    border-color: #ffbaff;
    box-shadow: 0 0 20px rgba(255, 160, 245, 0.8);
}

.option.correct {
    background: linear-gradient(135deg, #aa82ff, #d9a0ff);
    color: #fff;
    border-color: #d993ff;
    box-shadow: 0 0 20px rgba(200, 150, 255, 0.6);
}

.option.wrong {
    background: linear-gradient(135deg, #ff94ea, #ffb0ff);
    color: #fff;
    border-color: #ff94ea;
    box-shadow: 0 0 20px rgba(255, 160, 245, 0.6);
}

.option.disabled {
    pointer-events: none;
    opacity: 0.7;
}

#modalOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

.modal-box {
    background: rgba(15, 18, 35, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 26px 34px;
    max-width: 500px;
    width: 80%;
    text-align: center;
    border: 1px solid rgba(255, 160, 245, 0.35);
    box-shadow: 0 0 18px rgba(255, 140, 249, 0.18), inset 0 0 12px rgba(249, 200, 255, 0.06);
    position: relative;
    color: #fff;
}

.modal-box h2 {
    margin: 0 0 10px 0;
    font-family: 'Georgia', 'Times New Roman', serif;
    color: #ffc7f9;
    font-size: clamp(1.6rem, 2.8vw, 2.4rem);
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(240,0,220,0.55), 0 2px 10px rgba(0,0,0,0.6);
    font-weight: 600;
}

.modal-box p {
    font-size: 18px;
    color: #ffffff;
    opacity: 0.9;
    text-shadow: 0 0 8px rgba(247, 175, 238, 0.3);
    margin: 0;
}

.close-btn {
    position: absolute;
    right: 10px;
    top: 10px;
    cursor: pointer;
    font-size: 20px;
    color: #ffbaff;
}

.submit-btn, .back-btn {
    display: block;
    margin: 20px auto;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 1rem;
}

.submit-btn { background: #dba0ff; color: #fff; }
.back-btn { background: #9b59b6; color: #fff; }
</style>
</head>
<body>
<div id="section-2">
    <video id="video" autoplay loop muted style="position: fixed; top: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
        <source class="genvideo" src="../resources/sakuratree.mp4" type="video/mp4">
    </video>
</div>

<header id="nav-bar">
    <div id="one">
        <img id="playButton" src="../resources/Paimon.webp" alt="music button" height="50" width="50">
        <audio id="playAudio" src="../resources/Inazuma.mp3" type="audio/mp3"></audio>  
    </div>
    <nav>
        <a href="C:\Users\Acer\Documents\GitHub\GenshinQuiz\index.html">Home</a> 
        <a href="C:\Users\Acer\Documents\GitHub\GenshinQuiz\quiz\quizzes.html">Quizzes</a> 
        <a href="C:\Users\Acer\Documents\GitHub\GenshinQuiz\create\create.html">Create</a> 
    </nav>
</header>

<main>
    <div id="app"></div>
</main>

<footer style="background: rgba(0, 0, 0, 0.85); border-top: 1px solid rgba(255, 160, 245, 0.35); padding: 30px 16px; text-align: center;">
    <p style="color: #ffc7f9; font-size: 0.95rem;">Project created by: GenshinQuiz Team</p>
    <p style="color: #ffffff; font-size: 0.9rem; opacity: 0.85;">Lead Designer and Developer: Alina</p>
    <p style="color: #ffffff; font-size: 0.9rem; opacity: 0.85;">Development and Content: Svitlana</p>
</footer>

<script>
document.getElementById('playButton').addEventListener('click', function() {
    const audio = document.getElementById('playAudio');
    if (audio.paused) audio.play();
    else audio.pause();
});

const app = document.getElementById('app');
let quizzes = JSON.parse(localStorage.getItem('quizzes') || '[]');

function showQuizList() {
    app.innerHTML = `<div style="padding: 16px 24px; border-radius:16px; background: rgba(40,10,60,0.4); backdrop-filter: blur(12px); border:2px solid rgba(220,120,255,0.6); width:fit-content; margin:0 auto 20px; text-align:center;">
        <div class="quiz-title">Available Quizzes</div></div>`;

    if (!quizzes.length) { app.innerHTML += '<p>No quizzes found. Create some first.</p>'; return; }

    const listDiv = document.createElement('div');
    listDiv.className = 'quiz-list';

    quizzes.forEach((quiz) => {
        const item = document.createElement('div');
        item.className = 'quiz-item';
        item.innerHTML = `<div class="quiz-title">${quiz.title}</div>
                          <div class="quiz-description">${quiz.description}</div>`;
        const btn = document.createElement('button');
        btn.textContent = 'Take Quiz';
        btn.addEventListener('click', () => showQuiz(quiz));
        item.appendChild(btn);
        listDiv.appendChild(item);
    });

    app.appendChild(listDiv);
}

function showQuiz(quiz) {
    app.innerHTML = `<div class="quiz-title">${quiz.title}</div>
                     <div class="quiz-description">${quiz.description}</div>`;
    const quizContainer = document.createElement('div');
    quizContainer.id = 'quizContainer';
    app.appendChild(quizContainer);

    quiz.questions.forEach((q,i) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        qDiv.innerHTML = `<h4>${i+1}. ${q.text}</h4>`;

        q.options.forEach(opt => {
            const optDiv = document.createElement('div');
            optDiv.className = 'option';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `q${i}`;
            input.value = opt.id;
            input.style.display="none";

            const label = document.createElement('label');
            label.textContent = opt.text;

            optDiv.appendChild(input);
            optDiv.appendChild(label);

            optDiv.addEventListener('click', ()=>{
                qDiv.querySelectorAll('.option').forEach(o=>o.classList.remove('selected'));
                input.checked=true;
                optDiv.classList.add('selected');
            });

            qDiv.appendChild(optDiv);
        });

        quizContainer.appendChild(qDiv);
    });

    const submitBtn = document.createElement('button');
    submitBtn.textContent="Submit";
    submitBtn.className="submit-btn";
    submitBtn.addEventListener('click',()=>submitQuiz(quiz));

    const backBtn = document.createElement('button');
    backBtn.textContent="Back";
    backBtn.className="back-btn";
    backBtn.addEventListener('click',showQuizList);

    app.appendChild(submitBtn);
    app.appendChild(backBtn);
}

function submitQuiz(quiz){
    const quizContainer=document.getElementById("quizContainer");
    let score=0;

    quiz.questions.forEach((q,index)=>{
        const correctIds=q.options.filter(o=>o.correct||o.isCorrect).map(o=>o.id);
        const selectedInputs=[...document.querySelectorAll(`input[name="q${index}"]:checked`)];
        const selectedIds=selectedInputs.map(inp=>parseInt(inp.value));

        const qDiv=quizContainer.children[index];
        qDiv.querySelectorAll(".option").forEach(o=>{
            o.classList.remove("correct","wrong");
            o.classList.add("disabled");
        });

        const isCorrect=correctIds.length===selectedIds.length && correctIds.every(id=>selectedIds.includes(id));
        if(isCorrect) score++;

        q.options.forEach(opt=>{
            const optDiv=[...qDiv.querySelectorAll(".option")].find(d=>d.querySelector("input").value==opt.id);
            if(correctIds.includes(opt.id)) optDiv.classList.add("correct");
            else if(selectedIds.includes(opt.id)) optDiv.classList.add("wrong");
        });
    });

    let mark="Your score: "+score+" out of "+quiz.questions.length;
    if(quiz.grades && quiz.grades.length>0){
        for(let g of quiz.grades){
            if(score>=g.minScore){ mark=g.markText; break; }
        }
    }

    showModalResult(mark);
}

function showModalResult(text){
    const overlay=document.createElement("div");
    overlay.id="modalOverlay";

    const modal=document.createElement("div");
    modal.className="modal-box";

    const closeBtn=document.createElement("div");
    closeBtn.className="close-btn";
    closeBtn.textContent="✖";
    closeBtn.addEventListener("click",()=>overlay.remove());

    modal.innerHTML=`<h2>Your Result</h2><p>${text}</p>`;
    modal.appendChild(closeBtn);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
}

showQuizList();
</script>
</body>
</html>

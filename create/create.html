    <main>
         <div style="display:flex; justify-content:center; padding-top:20px;">
    <div style="
        background: rgba(15, 18, 35, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 26px 34px;
        max-width: 720px;
        width: 100%;
        text-align: center;
        border: 1px solid rgba(255, 160, 245, 0.35);
        box-shadow: 0 0 18px rgba(255, 140, 249, 0.18),

    ">
        <h1 style="
            margin: 0;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #ffc7f9;
            font-size: clamp(1.6rem, 2.8vw, 2.4rem);
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(240, 0, 220, 0.55),
                         0 2px 10px rgba(0, 0, 0, 0.6);
            font-weight: 600;
        ">
            Create a new quiz
        </h1>
    </div>
</div>
        <div class="quiz-form">
            <label>Quiz Title:</label><br>
            <input type="text" id="quizTitle" placeholder="Enter quiz title" /><br>

            <label>Description:</label><br>
            <textarea id="quizDescription" rows="3" placeholder="Enter quiz description"></textarea>

            <div id="questionsContainer"></div>
            <button id="addQuestionBtn" class="small-btn">+ Add Question</button>

            <div class="grading">
                <h3>Set Grade Boundaries</h3>
                <div id="gradingContainer"></div>
                <button id="addGradeBtn" class="small-btn">+ Add Grade Level</button>
            </div>

            <div style="text-align: left; margin-top: 20px;">
                <button id="saveQuizBtn">Save Quiz</button>
            </div>
        </div>
    </main>

  
    <footer style="

    ">

            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        });

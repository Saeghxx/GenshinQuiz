<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenshinQuiz - Create</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../cursor/cursor.css">
</head>

<body>
    <div id="section-2">
        <video id="video" autoplay loop muted
            style="position: fixed; top: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;">
            <source src="../resources/sakuratree.mp4" type="video/mp4">
        </video>
    </div>
    <header id="nav-bar">
        <div id="one">
            <img id="playButton" src="../resources/Paimon.webp" alt="music button" height="50" width="50">
            <audio id="playAudio" src="../resources/Inazuma.mp3"></audio>
        </div>

        <nav>
            <a href="/index.html">Home</a>
            <a href="/quiz/quizzes.html">Quizzes</a>
            <a href="/create/create.html">Create</a>
        </nav>
    </header>
    <main>
        <h5>Create a Quiz</h5>

        <div class="quiz-form">
            <label>Quiz Title:</label><br>
            <input type="text" id="quizTitle" placeholder="Enter quiz title"><br>

            <label>Description:</label><br>
            <textarea id="quizDescription" rows="3" placeholder="Enter quiz description"></textarea>
            <div id="questionsContainer"></div>
            <button id="addQuestionBtn" class="small-btn">+ Add Question</button>
            <div class="grading">
                <h3>Set Grade Boundaries</h3>
                <div id="gradingContainer"></div>
                <button id="addGradeBtn" class="small-btn">+ Add Grade Level</button>
            </div>
            <br>
            <div>
                <button id="saveQuizBtn">Save Quiz</button>
            </div>
        </div>
    </main>
    <footer>
        <p>Project created by: GenshinQuiz Team</p>
        <p>Lead Designer and Developer: Alina</p>
        <p>Development and Content: Svitlana</p>
    </footer>
    <script src="create.js"></script>

</body>
</html>

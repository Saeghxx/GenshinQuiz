<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenshinQuiz - Create</title>
    <link rel="stylesheet" href="../style.css"> 
    <link rel="stylesheet" href="create.css"> 
</head>
<body>
    <header id="nav-bar">
        <div id="logo-container">
            <a href="../home.html">Quizzlyyy</a> 
        </div>
        <nav>
            <a href="../home.html">Home</a> 
            <a href="../quizzes.html">Quizzes</a> 
            <a href="create.html">Create</a> 
        </nav>
        <div class="user-controls">
             <form action="/search" method="get" style="display: inline-flex;">
                 <input type="text" name="query" placeholder="Search quizzes...">
                 <button type="submit">Search</button>
             </form>
             </div>
    </header>

    <main>
        <h3>Create a new quiz</h3>
        <div class="quiz-form">
            <label>Quiz Title:</label><br>
            <input type="text" id="quizTitle" placeholder="Enter quiz title" /><br>

            <label>Description:</label><br>
            <textarea id="quizDescription" rows="3" placeholder="Enter quiz description"></textarea>

            <div id="questionsContainer"></div>
            <button id="addQuestionBtn" class="small-btn">+ Add Question</button>

            <div class="grading">
                <h3>Set Grade Boundaries</h3>
                <div id="gradingContainer"></div>
                <button id="addGradeBtn" class="small-btn">+ Add Grade Level</button>
            </div>

            <div style="text-align: left; margin-top: 20px;">
                <button id="saveQuizBtn">Save Quiz</button>
            </div>
        </div>
    </main>

    <footer>
        <p>Project created by: Quizzlyyy Dev Team</p>
        <p>Lead Designer and Developer: Alina</p>
        <p>Development and Content: Svitlana</p>
        <p>&copy; 2025 QuizTime. All rights reserved.</p>
    </footer>

    <script src="create.js"></script> 
</body>
</html>
